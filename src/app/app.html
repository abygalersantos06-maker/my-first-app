
<main class="resume">

  <!-- HEADER COMPONENT -->
  <app-header
    [fullName]="fullName"
    [location]="location"
    [email]="email"
    [phone]="phone"
    [profile]="profile">
  </app-header>

  <!-- PROFILE CARD COMPONENT -->
  <app-profile-card></app-profile-card>

  <!-- SKILLS COMPONENT -->
  <app-skills
    [skills]="skills"
    (skillSelected)="onSkillSelected($event)">
  </app-skills>

  <!-- ANGULAR INTERACTION -->
  <section class="interaction">
    <h2 class="section-title">Angular Interaction</h2>

    @if (selectedSkill) {
      <p>You selected: {{ selectedSkill }}</p>
    } @else {
      <p>Click one of your skills above to see your selection.</p>
    }
  </section>

  <!-- FOOTER COMPONENT -->
  <app-footer
  [fullName]="fullName"
  [proficiencies]="proficiencies">
</app-footer>

</main>
